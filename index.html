<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValidLeads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Header Container */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background-color: #000000;
      border-bottom: 1px solid #222222;
    }

    /* Logo Wrapper */
    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 50px; /* Adjust height as needed */
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #cccccc;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.2s ease-in-out;
    }

    .nav-links a:hover {
      color: #ff6b00; /* Matching logo orange theme */
    }

    /* CTA Button */
    .btn-cta {
      background-color: #f26522;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-cta:hover {
      background-color: #d95314;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="#" class="logo-container">
      <!-- Replace uuu.png with your hosted logo URL or image path -->
      <img src="uuu.png" alt="ValidLeads Logo" class="logo-img">
    </a>

    <nav>
      <ul class="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <a href="#get-started" class="btn-cta">Get Started</a>
  </header>

</body>
</html>
