<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValidLeads — Premium B2B Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030712; /* Deep dark background */
            --card-bg: #111827;
            --primary: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --accent: #22d3ee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 50px; }

        /* Premium Header */
        .hero { text-align: center; padding: 80px 20px; background: radial-gradient(circle at top, #1e3a8a 0%, #030712 70%); }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.05em; }
        .hero h1 span { color: var(--primary); }
        .hero p { color: var(--text-muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto 40px; }

        /* Modern Filter Tabs */
        .filter-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 60px; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 12px 24px; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .tab-btn:hover, .tab-btn.active { background: var(--primary); color: white; border-color: transparent; }

        /* Premium Grid */
        .services-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }

        .card { 
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); 
            padding: 40px; border-radius: 24px; transition: transform 0.3s ease; 
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .card::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(59,130,246,0.1), transparent 70%); opacity: 0; transition: opacity 0.3s; }
        .card:hover::before { opacity: 1; }

        .badge-category { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 15px; }
        .price-amount { font-size: 2.5rem; font-weight: 800; margin: 20px 0; }
        .btn-primary { 
            background: var(--primary); color: white; padding: 16px; border-radius: 12px; 
            text-decoration: none; text-align: center; font-weight: 600; display: block;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>B2B Data at <span>Scale.</span></h1>
        <p>Premium lead intelligence. High-accuracy, verified data, and automated workflows.</p>
    </header>

    <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="tab-btn" onclick="filterCategory('lead-export', this)">Exports</button>
        <button class="tab-btn" onclick="filterCategory('clay-enrich', this)">Clay</button>
    </div>

    <div class="services-container">
        <div class="grid" id="services-grid">
            <!-- Example Card -->
            <div class="card" data-category="lead-export">
                <span class="badge-category">Apollo Data</span>
                <h3>10K Apollo Emails</h3>
                <div class="price-amount">$35</div>
                <a href="#" class="btn-primary">Order via WhatsApp</a>
            </div>
            <!-- Add remaining cards here -->
        </div>
    </div>

    <script>
        function filterCategory(cat, btn) {
            // Update active button styling
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Filter cards
            document.querySelectorAll('.card').forEach(card => {
                if(cat === 'all' || card.getAttribute('data-category') === cat) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
